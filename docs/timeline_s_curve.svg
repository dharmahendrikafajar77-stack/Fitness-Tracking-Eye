<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching Royal Blue Canva slide -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB" />
      <stop offset="100%" stop-color="#00388F" />
    </linearGradient>

    <!-- Card Fill Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D7A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#001F58" stop-opacity="0.95" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow for Cards -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001035" flood-opacity="0.6" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="cyanArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00F0FF" />
    </marker>
  </defs>

  <!-- Canvas Background (Royal Blue) -->
  <rect width="1000" height="620" rx="16" fill="url(#bgGrad)" />

  <!-- S-Curve Winding Track (Glowing Cyan) -->
  <path d="M 330 145 C 550 145, 550 145, 670 145 C 800 145, 820 230, 800 320 C 780 400, 720 465, 500 465 C 420 465, 360 465, 330 465" 
        fill="none" 
        stroke="#00F0FF" 
        stroke-width="5" 
        stroke-dasharray="10 6"
        filter="url(#glow)" />

  <path d="M 330 145 C 550 145, 550 145, 670 145 C 800 145, 820 230, 800 320 C 780 400, 720 465, 500 465 C 420 465, 360 465, 330 465" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="2" />

  <!-- Animated-style Direction Arrows along the curve -->
  <!-- Arrow 1 -> 2 -->
  <path d="M 470 145 L 485 145" stroke="#00F0FF" stroke-width="4" marker-end="url(#cyanArrow)" />
  <!-- Curve Arrow down -->
  <path d="M 798 300 L 794 320" stroke="#00F0FF" stroke-width="4" marker-end="url(#cyanArrow)" />
  <!-- Arrow 3 -> 4 -->
  <path d="M 520 465 L 505 465" stroke="#00F0FF" stroke-width="4" marker-end="url(#cyanArrow)" />

  <!-- ==================== FASE 1 (Top Left) ==================== -->
  <g transform="translate(80, 85)" filter="url(#cardShadow)">
    <rect width="250" height="120" rx="12" fill="url(#cardGrad)" stroke="#00F0FF" stroke-width="2.5" />
    <circle cx="28" cy="35" r="16" fill="#00F0FF" />
    <text x="28" y="41" fill="#002D7A" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="900" text-anchor="middle">1</text>
    <text x="54" y="41" fill="#00F0FF" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="19" font-weight="800">Fase 1</text>
    <text x="20" y="78" fill="#FFFFFF" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" font-weight="600">Fondasi &amp; Prototipe</text>
    <text x="20" y="100" fill="#E0F7FF" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" font-weight="600">Unit 1</text>
  </g>

  <!-- ==================== FASE 2 (Top Right) ==================== -->
  <g transform="translate(670, 85)" filter="url(#cardShadow)">
    <rect width="250" height="120" rx="12" fill="url(#cardGrad)" stroke="#00F0FF" stroke-width="2.5" />
    <circle cx="28" cy="35" r="16" fill="#00F0FF" />
    <text x="28" y="41" fill="#002D7A" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="900" text-anchor="middle">2</text>
    <text x="54" y="41" fill="#00F0FF" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="19" font-weight="800">Fase 2</text>
    <text x="20" y="78" fill="#FFFFFF" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" font-weight="600">Pengembangan Engine</text>
    <text x="20" y="100" fill="#E0F7FF" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" font-weight="600">&amp; Firmware</text>
  </g>

  <!-- ==================== FASE 3 (Bottom Right) ==================== -->
  <g transform="translate(670, 405)" filter="url(#cardShadow)">
    <rect width="250" height="120" rx="12" fill="url(#cardGrad)" stroke="#00F0FF" stroke-width="2.5" />
    <circle cx="28" cy="35" r="16" fill="#00F0FF" />
    <text x="28" y="41" fill="#002D7A" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="900" text-anchor="middle">3</text>
    <text x="54" y="41" fill="#00F0FF" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="19" font-weight="800">Fase 3</text>
    <text x="20" y="78" fill="#FFFFFF" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" font-weight="600">Kalibrasi Stereo 3D</text>
    <text x="20" y="100" fill="#E0F7FF" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" font-weight="600">&amp; Rekam Video</text>
  </g>

  <!-- ==================== FASE 4 (Bottom Left) ==================== -->
  <g transform="translate(80, 405)" filter="url(#cardShadow)">
    <rect width="250" height="120" rx="12" fill="url(#cardGrad)" stroke="#00F0FF" stroke-width="2.5" />
    <circle cx="28" cy="35" r="16" fill="#00F0FF" />
    <text x="28" y="41" fill="#002D7A" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="900" text-anchor="middle">4</text>
    <text x="54" y="41" fill="#00F0FF" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="19" font-weight="800">Fase 4</text>
    <text x="20" y="78" fill="#FFFFFF" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" font-weight="600">Integrasi, Pengujian</text>
    <text x="20" y="100" fill="#E0F7FF" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="15" font-weight="600">&amp; Serah Terima</text>
  </g>
</svg>
